name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Run build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Download and setup PocketBase
        run: |
          cd fastreader-backend
          curl -L https://github.com/pocketbase/pocketbase/releases/download/v0.23.4/pocketbase_0.23.4_linux_amd64.zip -o pocketbase.zip
          unzip pocketbase.zip
          chmod +x pocketbase

      - name: Start PocketBase backend
        run: |
          cd fastreader-backend
          ./pocketbase serve --http="127.0.0.1:8090" &
          # Wait for PocketBase to be ready
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8090/api/health > /dev/null; then
              echo "PocketBase is ready"
              break
            fi
            echo "Waiting for PocketBase..."
            sleep 1
          done

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
